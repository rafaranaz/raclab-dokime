# Closed lists used by the commit and scope checks.
# A module gets its scope here when its branch of work is opened.

types = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "revert", "style", "test"]

# Commit types whose message must explain the reason for the change in a body.
body_required = ["feat", "fix", "refactor", "perf"]

# Paths any branch may touch, whatever its scope. This file is shared so that a module branch can
# declare its own scope; reviewers check that a branch only adds or changes its own entry.
shared = ["docs/adr/**", "docs/ROADMAP.md", "docs/ROADMAP.es.md", "tools/scopes.toml"]

[scopes.repo]
description = "Repository governance: tooling, CI, working agreement, development skills."
paths = [
    ".claude/**",
    ".github/**",
    ".gitignore",
    ".python-version",
    "CLAUDE.md",
    "CONTRIBUTING.es.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.es.md",
    "README.md",
    "docs/requirements/repo.md",
    "package-lock.json",
    "package.json",
    "pyproject.toml",
    "src/dokime/__init__.py",
    "src/dokime/py.typed",
    "tests/__init__.py",
    "tests/repo/**",
    "tools/**",
    "uv.lock",
]

[scopes.arch]
description = "Reference architecture: documents and diagrams under docs/architecture."
paths = ["docs/architecture/**"]

[scopes.core]
description = "Domain types shared by every module: verdicts and their aggregation, findings."
paths = ["src/dokime/core/**", "tests/core/**", "docs/requirements/core.md"]

[scopes.contract]
description = "Read, validate and compare contracts: schema, EARS syntax, directives, coverage, contradictions."
paths = ["src/dokime/contract/**", "tests/contract/**", "docs/requirements/contract.md"]
