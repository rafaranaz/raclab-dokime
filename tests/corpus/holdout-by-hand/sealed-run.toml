# The sealed run of B1 (CORPUS-066 to CORPUS-071, ADR-0014, ADR-0075).

# The three contracts of B0 sealed with `dokime contract seal`, each in a local clone of its project
# on the base of its case, after a commit of the recipients of an identity made for the measurement;
# the visible contract and the sealed batch were committed on top, and are kept in `sealed-run/`.
# The examples of these contracts are public in this repository, outside the history of the
# projects, so the detection of what was published does not see them: the measurement shows the
# mechanism, not the value of a hold-out with secret examples, which B3 and B4 measure.
# The seed and the held-out examples are written here only because these examples are already
# public; in a real seal the seed lives only in the batch, and its digest in the ledger of the seal.
date = "2026-11-20"

[[contract]]
project = "mdformat"
name = "format-a-blank-paragraph-between-blocks"
batch_base = "3c095095ca58416f3d7c76b7e122a00864b4bffd"
seed = 3505217664730090
held_out = ["E-47ce", "E-9a59"]
kept_visible = []
held_out_by_hand_in_b0 = ["E-47ce", "E-4cdd"]
without_holdout = [
    { requirement = "drop-a-blank-paragraph-next-to-paragraphs", case = "nbsp-between-paragraphs", motive = "single-example" },
    { requirement = "drop-a-blank-paragraph-next-to-paragraphs", case = "nbsp-before-a-heading", motive = "single-example" },
    { requirement = "format-other-documents", case = "heading-then-paragraph", motive = "single-example" },
]

