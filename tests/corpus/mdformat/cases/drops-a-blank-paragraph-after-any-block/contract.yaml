format: 1
story: drops-a-blank-paragraph-after-any-block
may_modify_tests: []

requirements:
  - id: drop-a-blank-paragraph-between-blocks
    kind: change
    text: When the input has a paragraph of Unicode spaces only between two blocks that are not paragraphs, mdformat shall exit with status 0 and print the input without that paragraph.
    source: written
  - id: format-the-rest-as-before
    kind: preserve
    text: When the input has no paragraph of Unicode spaces only between two blocks that are not paragraphs, mdformat shall print the same text as before the change.
    source: written

examples:
  - id: E-75ac
    requirement: drop-a-blank-paragraph-between-blocks
    case: after-a-break-or-a-list
    boundary: cli
    target: python -m mdformat
    origin: human
    steps:
      - input: {args: ["-"], stdin: "- i\n\n\u2009\n\n##### k\n"}
        expect: {exit: 0, stdout: "- i\n\n##### k\n"}
  - id: E-f0d2
    requirement: drop-a-blank-paragraph-between-blocks
    case: after-code-or-a-heading
    boundary: cli
    target: python -m mdformat
    origin: human
    steps:
      - input: {args: ["-"], stdin: "```py\nx = 1\n```\n\u2002\n## d\n"}
        expect: {exit: 0, stdout: "```py\nx = 1\n```\n\n## d\n"}
  - id: E-5edf
    requirement: format-the-rest-as-before
    case: unchanged
    boundary: cli
    target: python -m mdformat
    origin: human
    steps:
      - input: {args: ["-"], stdin: "para\n\u3000\n# f\n"}
        expect: {exit: 0, stdout: "para\n\n# f\n"}
  - id: E-715c
    requirement: format-the-rest-as-before
    case: unchanged
    boundary: cli
    target: python -m mdformat
    origin: human
    steps:
      - input: {args: ["-"], stdin: "***\n\n- j\n"}
        expect: {exit: 0, stdout: "______________________________________________________________________\n\n- j\n"}
