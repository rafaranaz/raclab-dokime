# The commits of the recipients that the contracts of the corpus with a sealed batch were sealed on
# (CORPUS-092 to CORPUS-094). The command that seals gives the batch, as its base, the commit of the
# checkout it seals in, and each contract was sealed on a commit that adds .dokime/recipients.txt on
# top of the base of its case, made in a local checkout and in no repository. The test of the cases
# makes that commit again from these fields, checks its hash, and commits the contract and the batch
# on top of it, so that the base of the batch is in the history of the change.
#
# The hash of each commit is the field `base` of the event `run.started` of the ledger of its seal,
# kept outside the repository; `event_at` and `event_hash` name that event. The author is also the
# committer, with the same date, given as git gives it raw. A seal made from now on follows the
# convention of the README: the date of the base, the author dokime corpus <corpus@dokime.invalid>
# and the message "the recipients of the corpus".

