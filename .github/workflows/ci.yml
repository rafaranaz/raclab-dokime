name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Import contracts between modules
        run: uv run lint-imports
      - name: Podman accepts the limits of a run
        run: |
          systemctl --version | head -n 1
          podman --version
          cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers"
          podman run --rm --network none --cpus 0.5 --memory 64m --memory-swap 64m \
            --pids-limit 16 docker.io/library/busybox:1.36 true
      - name: Install the binary age, which the tests of the sealed store open batches with
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q age
          age --version
      - name: Tests and coverage
        run: uv run pytest --cov

  corpus-part:
    # The packs and the cases of the corpus at the commits of their projects, with the network
    # (ADR-0052), in four parts at once (ADR-0078); a pull request of text does not run them
    # (ADR-0077). The job corpus below gathers the parts.
    name: corpus (${{ matrix.part }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part: [a, b, c, d]
    defaults:
      run:
        # With a shell named, GitHub runs bash with -eo pipefail; without one it runs bash -e, and
        # the gate below would end with the code of tee.
        shell: bash
    env:
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tests of the cases read their history, and refuse a shallow clone; the changes
          # check reads the base of the pull request.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Whether this pull request runs the corpus
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run python -m tools.corpus_changes --event "$EVENT" --base "$BASE" --head HEAD \
            --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Clone each project of the corpus with its whole history
        if: steps.changes.outputs.run == 'true'
        run: |
          clones="$RUNNER_TEMP/corpus"
          mkdir -p "$clones"
          for source in tests/corpus/*/source.toml; do
            name=$(basename "$(dirname "$source")")
            address=$(uv run python -c \
              'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["repository"])' \
              "$source")
            git clone --quiet "$address" "$clones/$name"
          done
          echo "DOKIME_CORPUS_CLONES=$clones" >> "$GITHUB_ENV"
      - name: Run the tests of the corpus of this part
        if: steps.changes.outputs.run == 'true'
        env:
          DOKIME_CORPUS: "1"
        run: |
          start=$(date +%s)
          set +e
          uv run pytest -p no:cacheprovider -p tools.corpus_parts --corpus-part "$PART" -s \
            tests/corpus --junitxml=corpus.xml --durations=0
          code=$?
          echo "part $PART: pytest ended with $code in $(( $(date +%s) - start )) s on $(nproc) cores" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Every project was self-checked and passed
        if: always() && steps.changes.outputs.run == 'true' && matrix.part == 'd'
        run: uv run python -m tools.check_corpus --report corpus.xml | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Leave what this part did for the job corpus
        if: always()
        env:
          RAN: ${{ steps.changes.outputs.run == 'true' }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p "parts/$PART"
          echo "$RAN" > "parts/$PART/ran"
          echo "$STATUS" > "parts/$PART/status"
          if [ -f corpus.xml ]; then cp corpus.xml "parts/$PART/corpus.xml"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: corpus-part-${{ matrix.part }}
          path: parts
          if-no-files-found: error

  corpus:
    # The required check of the corpus: it fails unless the four parts ended in success and,
    # when they ran the corpus, held as many tests as one collection of it (ADR-0078).
    name: corpus
    needs: corpus-part
    if: always()
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --locked
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: corpus-part-*
          path: parts
          merge-multiple: true
      - name: One collection of the corpus
        run: uv run pytest -p no:cacheprovider --collect-only -q tests/corpus > collection.txt
      - name: Every part ended in success and the parts ran the whole corpus
        env:
          PARTS: ${{ needs.corpus-part.result }}
        run: |
          results=()
          for part in a b c d; do
            results+=("--result=$part=$(cat "parts/$part/status" 2>/dev/null || echo nothing)")
          done
          uv run python -m tools.check_corpus_parts --parts parts --collection collection.txt \
            "${results[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$PARTS" != success ]; then
            echo "[corpus] the parts ended in $PARTS" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  probe-start:
    name: probe the start of a container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Time one observation of one example in a container of its own, twenty times
        run: |
          mkdir -p "$RUNNER_TEMP/probe/project" "$RUNNER_TEMP/probe/context"
          printf 'def one():\n    return 1\n' > "$RUNNER_TEMP/probe/project/proj.py"
          PYTHONPATH=. uv run python - "$RUNNER_TEMP/probe" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import statistics, sys, time
          from pathlib import Path
          from dokime.core.observation import Boundary, ExampleRequest, ObservationLimits
          from dokime.core.runtime import BuildLimits
          from dokime.sandbox.podman import PodmanRuntime
          from tests.sandbox.engines import ENGINES, PYTHON
          S = Path(sys.argv[1])
          adapter = PodmanRuntime()
          ENGINES["podman"].pull(PYTHON)
          (S / "context" / "Dockerfile").write_text(f"FROM {PYTHON}\nENV PYTHONPATH=/dokime/project\n")
          image = adapter.build(S / "context" / "Dockerfile", S / "context", BuildLimits()).image
          request = ExampleRequest(example="E", boundary=Boundary.FUNCTION, target="proj:one", inputs=({},))
          times = []
          for _ in range(20):
              start = time.perf_counter()
              adapter.observe(image, S / "project", (request,), ObservationLimits())
              times.append(time.perf_counter() - start)
          print(f"observations of one example in a container: n={len(times)}, median={statistics.median(times):.3f} s, min={min(times):.3f} s, max={max(times):.3f} s")
          print("all: " + ", ".join(f"{t:.3f}" for t in times))
          PY

  governance:
    name: governance checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: No history in code
        run: uv run python -m tools.check_history
      - name: EARS syntax
        run: uv run python -m tools.check_ears
      - name: Requirement to test traceability
        run: uv run python -m tools.check_traceability
      - name: Markdown links
        run: uv run python -m tools.check_links
      - name: Spanish translations up to date
        run: uv run python -m tools.check_translations
      - name: Decision records state their basis and match the index
        run: uv run python -m tools.check_adrs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned Mermaid renderer
        run: npm ci --no-audit --no-fund
      - name: Mermaid diagrams render
        run: uv run python -m tools.check_mermaid
      - name: No tracked file is ignored
        run: |
          ignored="$(git ls-files --cached --ignored --exclude-standard)"
          if [ -n "$ignored" ]; then echo "Tracked files matched by .gitignore:"; echo "$ignored"; exit 1; fi

  discipline:
    name: commits and branch scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      BASE: origin/${{ github.base_ref }}
      BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Conventional Commits with the branch scope
        run: uv run python -m tools.check_commits --base "$BASE" --branch "$BRANCH"
      - name: Changes stay inside the branch scope
        run: uv run python -m tools.check_scope --base "$BASE" --branch "$BRANCH"

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Known vulnerabilities in locked dependencies
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
