[project]
name = "raclab-dokime"
version = "0.0.0"
description = "Spec-driven pipeline for coding agents with mechanical verification of every step."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dokime"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "C90", "SIM", "RUF", "PT", "N"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"tools/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tools", "tests"]
mypy_path = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.coverage.run]
source = ["src", "tools"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
