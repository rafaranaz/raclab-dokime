# The runs of the audit of the cases with a sealed batch with the key (CORPUS-087, CORPUS-088),
# which the maintainer starts on their machine, typing the passphrase in the terminal:
#
#   DOKIME_CORPUS=1 DOKIME_CORPUS_IDENTITY=<identity> uv run pytest -s tests/corpus/test_corpus_audit.py
#
# The expected verdict and failing gate of each case are in its case.toml, committed before the
# run; each run is recorded here after it, with its date and, for each case, what the audit gave.
# The identity stays outside the repository and outside CI.
#
# A limit of what these runs measure: the held-out examples of G2 are inputs of the tests that the
# fix itself adds, public in the repository of the project, and one of them appears in
# witnesses.toml in the name of a parametrized test, which the self-check needs. They are secret
# for whoever works from the base, not secret at all, so for G2 a run here shows that dokime catches
# a patch that fits what is visible, not that what is held out cannot be found out. G1', which
# replaces the withdrawn G1, has inputs of its own in every example, none in the contract of G1, the
# commit of the witness or witnesses.toml.

[[run]]
date = "2026-11-23"
key_given = true
launched = 17
source = "the lines that the test printed for each case, as the maintainer gave them"
limit = "six of the cases launched gave ERROR at the environment, build-failed for no space left on device: pytest keeps the tmp_path of each case with its storage of podman, and /tmp filled; they gave no verdict and are not recorded here, and the second run audited them"
pytest = "6 failed, 11 passed in 750.93s"

