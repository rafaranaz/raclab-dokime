# Hand-written contract for milestone A0, on a change this repository already made:
# the tool that cleans pull request descriptions.
format: 1
story: clean-pr-description
may_modify_tests: []

requirements:
  - id: remove-tool-attribution
    kind: new
    text: When a pull request description contains an attribution line added by tooling, the description cleaner shall remove that line together with the separator line directly above it.
    source: written
  - id: remove-session-link
    kind: new
    text: When a pull request description contains a line that is only a link to a Claude session, the description cleaner shall remove that line.
    source: written
  - id: keep-everything-else
    kind: new
    text: The description cleaner shall leave unchanged every line that is not an attribution line, its separator, a session link or a trailing blank line.
    source: written

examples:
  # remove-tool-attribution: the attribution line added by tooling goes, with the separator above it.
  - id: E-ff65
    requirement: remove-tool-attribution
    case: footer-with-separator
    boundary: function
    target: tools.clean_pr_body:clean
    origin: human
    steps:
      - input:
          kwargs:
            body:
              $text: |
                ## What changes

                Text.

                ---
                _Generated by [Claude Code](https://claude.ai/code)_
              final_newline: true
        expect:
          returns:
            $text: |
              ## What changes

              Text.
            final_newline: true
  - id: E-eeb9
    requirement: remove-tool-attribution
    case: footer-with-separator
    boundary: function
    target: tools.clean_pr_body:clean
    origin: human
    steps:
      - input:
          kwargs:
