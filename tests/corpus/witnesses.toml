commit = "27e2ba3e10dad83625662186f2dd3b295fd82079"
isolated = true
isolated_reason = "Changes whitespace normalisation in is_md_equal (strip after removing empty paragraphs, drop spaces before opening and after closing tags) so an empty Unicode-space paragraph between non-paragraph elements no longer makes the formatted output compare unequal."
expressible = true
boundary = "cli"
target = "python -m mdformat"
expressible_reason = "python -m mdformat - with stdin \"```\\na\\n```\\n\\u2003\\n# A\\n\": exit 0 with the formatted text on stdout after, exit 1 with stderr containing \"Could not format\" before (the CLI runs is_md_equal on its output; the direct function is in private mdformat._util)."
doubtful = true

# The sample of the reading: in each project, one witness drawn among those that are expressible and
# one among those that are not, with random.Random(seed).choice over the commits in the order of the
# labels above, and run in the image of the pack of its project on both sides of the change.

[sample]
seed = 20261118
date = "2026-11-18"

[[sample.run]]
project = "cachetools"
commit = "a6f073a71633373bdec6d40d39bbef3383ce022a"
example = "function cachetools:cached, args [null] and kwargs {} and {info: true}"
before = "returns a decorator function, not a JSON value"
after = "raises TypeError: cache must not be None"
confirmed = true
why_not = ""

[[sample.run]]
project = "cachetools"
commit = "c8b4ee2f6ce9237e2c6e50ebf61e1f4b3bd88780"
example = "function cachetools.keys:methodkey, args [\"x\"], kwargs {self: 1}"
before = "raises TypeError: methodkey() got multiple values for argument 'self'"
after = "returns (<class 'cachetools.keys._HashedTuple'>, ('self', 1)), not a JSON value"
confirmed = true
why_not = "what the fix gives is a tuple holding a class, which an expectation at the boundary function cannot name, so only the failure before the change can be written"

