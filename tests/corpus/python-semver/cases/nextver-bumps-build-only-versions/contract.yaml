# Case of the corpus, drafted for milestone A3 (ADR-0055).
# python-semver, fix commit 4e09ef0, "fix: next_version should bump version for build-only versions (#469)".
# The rule of nextver, measured before and after the fix: when the parts below the given part are 0
# (always so for patch), a version with a prerelease is finalized; otherwise the given part is
# incremented and the parts below it are set to 0. The fix makes build metadata alone no longer
# count as a prerelease.
format: 1
story: nextver-bumps-build-only-versions
may_modify_tests: ["docs/usage/increase-parts-of-a-version_prereleases.rst"]

requirements:
  - id: bump-build-only-versions
    kind: change
    text: When the command nextver is given a version with build metadata and no prerelease, and the parts below the given part are 0, the command shall print the version with the given part incremented, without the build metadata.
    source: written
  - id: bump-other-versions-without-prerelease
    kind: preserve
    text: When the command nextver is given a version without a prerelease that is not covered by bump-build-only-versions, the command shall print the version with the given part incremented, the parts below it set to 0 and without build metadata.
    source: written
  - id: finalize-prereleases
    kind: preserve
    text: When the command nextver is given a version with a prerelease, and the parts below the given part are 0, the command shall print the version without its prerelease and without its build metadata.
    source: written
  - id: bump-prereleases
    kind: preserve
    text: When the command nextver is given a version with a prerelease, and a part below the given part is not 0, the command shall print the version with the given part incremented, the parts below it set to 0 and without prerelease.
    source: written
  - id: refuse-invalid-versions
    kind: preserve
    text: If the command nextver is given a text that is not a valid version, then the command shall exit with status 2 and write an error that names that text to the standard error.
    source: written

examples:
  # bump-build-only-versions: before the change, the build metadata was dropped and the version
  # was not bumped, as if the build were a prerelease.
  - id: E-4078
    requirement: bump-build-only-versions
    case: patch
    boundary: cli
    target: python -m semver
    origin: human
    steps:
      - input: {args: [nextver, 1.2.3+build.5, patch]}
        expect: {exit: 0, stdout: "1.2.4\n"}
  - id: E-a6ea
    requirement: bump-build-only-versions
    case: patch-of-a-zero
    boundary: cli
    target: python -m semver
    origin: human
    steps:
      - input: {args: [nextver, 1.0.0+build.5, patch]}
        expect: {exit: 0, stdout: "1.0.1\n"}
  - id: E-d277
    requirement: bump-build-only-versions
    case: minor
    boundary: cli
    target: python -m semver
    origin: human
    steps:
      - input: {args: [nextver, 1.2.0+build.5, minor]}
        expect: {exit: 0, stdout: "1.3.0\n"}
  - id: E-3721
    requirement: bump-build-only-versions
    case: major
    boundary: cli
    target: python -m semver
    origin: human
    steps:
      - input: {args: [nextver, 1.0.0+build.5, major]}
        expect: {exit: 0, stdout: "2.0.0\n"}

  # bump-other-versions-without-prerelease: the parts below are set to 0, with or without build.
  - id: E-e888
    requirement: bump-other-versions-without-prerelease
    case: plain-patch
    boundary: cli
    target: python -m semver
    origin: human
    steps:
      - input: {args: [nextver, 1.2.3, patch]}
        expect: {exit: 0, stdout: "1.2.4\n"}
  - id: E-4669
    requirement: bump-other-versions-without-prerelease
    case: plain-minor
    boundary: cli
    target: python -m semver
    origin: human
    steps:
      - input: {args: [nextver, 1.2.3, minor]}
        expect: {exit: 0, stdout: "1.3.0\n"}
  - id: E-e8ac
    requirement: bump-other-versions-without-prerelease
    case: build-with-a-part-below-not-0
    boundary: cli
    target: python -m semver
    origin: human
    steps:
      - input: {args: [nextver, 1.2.1+build.5, minor]}
        expect: {exit: 0, stdout: "1.3.0\n"}

  # finalize-prereleases: a prerelease ends in its release.
  - id: E-6748
    requirement: finalize-prereleases
    case: patch-with-build
    boundary: cli
    target: python -m semver
    origin: human
    steps:
      - input: {args: [nextver, 1.2.3-rc.1+build.5, patch]}
        expect: {exit: 0, stdout: "1.2.3\n"}
  - id: E-0b7e
    requirement: finalize-prereleases
    case: minor
    boundary: cli
    target: python -m semver
    origin: human
    steps:
      - input: {args: [nextver, 1.2.0-rc.1, minor]}
        expect: {exit: 0, stdout: "1.2.0\n"}
  - id: E-b086
    requirement: finalize-prereleases
    case: major
    boundary: cli
    target: python -m semver
    origin: human
    steps:
      - input: {args: [nextver, 1.0.0-rc.1, major]}
        expect: {exit: 0, stdout: "1.0.0\n"}

  # bump-prereleases: a prerelease with a part below not 0 moves to the next release.
  - id: E-42a1
    requirement: bump-prereleases
    case: minor
    boundary: cli
    target: python -m semver
    origin: human
    steps:
      - input: {args: [nextver, 1.2.3-rc.1, minor]}
        expect: {exit: 0, stdout: "1.3.0\n"}
  - id: E-386b
    requirement: bump-prereleases
    case: major
    boundary: cli
    target: python -m semver
    origin: human
    steps:
      - input: {args: [nextver, 1.2.3-rc.1, major]}
        expect: {exit: 0, stdout: "2.0.0\n"}

  # refuse-invalid-versions: the command fails, and says why.
  - id: E-9fa2
    requirement: refuse-invalid-versions
    case: not-a-version
    boundary: cli
    target: python -m semver
    origin: human
    steps:
      - input: {args: [nextver, x.y.z, patch]}
        expect: {exit: 2, stdout: "", stderr: {$contains: "x.y.z is not valid SemVer string"}}
