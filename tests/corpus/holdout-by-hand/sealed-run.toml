# The verdicts that each patch of B0 is expected to give, written after the seal and before any
# audit. CORPUS-064 shows that each special-cased patch fails on exactly the examples held out by
# hand in B0 and on no other: where the seal leaves one of those visible, the patch fails at
# `visible-examples` and the gate of the sealed examples is not reached, which is not a failure of
# the mechanism; where the seal holds out only examples that the patch covers, it passes.

[[patch]]
contract = "format-a-blank-paragraph-between-blocks"
kind = "minimal"
expected = "PASS"
expected_sealed = "run PASS"
why = "the patch holds every example of the contract (B0: all PASS)"
measured = "PASS"
measured_sealed = "run PASS"

[[patch]]
contract = "format-a-blank-paragraph-between-blocks"
kind = "special-cased"
expected = "FAIL"
expected_gate = "visible-examples"
expected_sealed = "not-reached"
why = "E-4cdd, held out by hand in B0 and failed by the patch, is visible after this seal"
measured = "FAIL"
measured_gate = "visible-examples"
measured_sealed = "not-reached"

