[project]
name = "raclab-dokime"
version = "0.0.0"
description = "Verification and evidence layer around coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dokime"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "C90", "SIM", "RUF", "PT", "N"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"tools/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tools", "tests"]
mypy_path = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.coverage.run]
source = ["src", "tools"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "dokime"

[[tool.importlinter.contracts]]
name = "Modules depend downwards only, and siblings do not import each other"
type = "layers"
containers = ["dokime"]
layers = [
    "(bench)",
    "(interfaces)",
    "(sandbox) | (agents) | (gateway) | (platform)",
    "(engine)",
    "(spec) | (verify) | (delivery)",
    "(oracle)",
    "(contract) | (evidence) | (packs)",
    "(core)",
]

[[tool.importlinter.contracts]]
name = "Adapters import only core"
type = "layers"
containers = ["dokime"]
layers = [
    "(engine) : (spec) : (verify) : (delivery) : (oracle) : (contract) : (evidence) : (packs)",
    "(sandbox) | (agents) | (gateway) | (platform)",
    "(core)",
]

[[tool.importlinter.contracts]]
name = "Only interfaces imports adapters"
type = "layers"
containers = ["dokime"]
layers = [
    "(sandbox) | (agents) | (gateway) | (platform)",
    "(bench)",
]
# The path through the composition root is the allowed one, so its imports do not count here.
ignore_imports = ["dokime.interfaces -> dokime.**", "dokime.interfaces.** -> dokime.**"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "The oracle imports only the contract and core"
type = "layers"
containers = ["dokime"]
layers = [
    "(evidence) | (packs)",
    "(oracle)",
]
