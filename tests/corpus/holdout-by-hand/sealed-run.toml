# Every call of git and podman of the eight sealed audits went through a wrapper that logged its
# arguments, its environment, the descriptors it inherited and, for a build, the files of its
# context. The passphrase was given with --passphrase-fd. None of the calls held the path of the
# identity, its name or the passphrase, and none inherited the descriptor of the passphrase.
[subprocesses]
git = 1456
podman = 476
builds_with_a_context = 64
holding_the_identity = 0
holding_the_passphrase = 0
inheriting_the_descriptor = 0
