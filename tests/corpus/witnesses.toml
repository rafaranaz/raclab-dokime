before = "exit 0, stdout 1.2.3-rc10"
after = "exit 0, stdout 1.2.4-rc10"
confirmed = true
why_not = ""

[[sample.run]]
project = "python-semver"
commit = "9f6894daaf62d55fc37cece10948e7e1cc3dc369"
