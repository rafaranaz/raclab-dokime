  # keep-everything-else: everything else stays as it was.
  - id: E-8023
    requirement: keep-everything-else
    case: own-attribution-kept
    boundary: function
    target: tools.clean_pr_body:clean
    origin: human
    steps:
      - input:
          kwargs:
            body:
              $text: |
                Text.

                ---

                Designed and reviewed by @someone, built with [Claude Code](https://claude.com/claude-code)
              final_newline: true
        expect:
          returns:
            $text: |
              Text.

              ---

              Designed and reviewed by @someone, built with [Claude Code](https://claude.com/claude-code)
            final_newline: true
  - id: E-1dfb
    requirement: keep-everything-else
    case: separator-not-before-a-removed-line
    boundary: function
    target: tools.clean_pr_body:clean
    origin: human
    steps:
      - input:
          kwargs:
            body:
              $text: |
                Intro

                ---

                More text

                ---
                _Generated by [Claude Code](https://claude.ai/code)_
              final_newline: true
        expect:
          returns:
            $text: |
              Intro

              ---

              More text
            final_newline: true
  - id: E-8d87
    requirement: keep-everything-else
    case: separator-not-before-a-removed-line
    boundary: function
    target: tools.clean_pr_body:clean
    origin: human
    steps:
      - input:
          kwargs:
            body:
              $text: |
                | a | b |
                |---|---|
                | 1 | 2 |
              final_newline: true
        expect:
          returns:
            $text: |
              | a | b |
              |---|---|
              | 1 | 2 |
            final_newline: true
  - id: E-5631
    requirement: keep-everything-else
    case: empty-description
    boundary: function
    target: tools.clean_pr_body:clean
    origin: human
    steps:
      - input: {kwargs: {body: ""}}
        expect: {returns: ""}

  # The command, end to end: it rewrites the file and reports whether it changed.
  - id: E-4c43
    requirement: remove-tool-attribution
    case: command-rewrites-the-file
    boundary: cli
    target: python -m tools.clean_pr_body
    origin: human
    steps:
      - input:
          args: [body.md]
          files:
            body.md:
              $text: |
                Text.

                ---
                _Generated by [Claude Code](https://claude.ai/code)_
              final_newline: true
        expect:
          exit: 0
          stdout: "changed=true\n"
          files:
            body.md:
              $text: |
                Text.
              final_newline: true
  - id: E-a5cb
    requirement: keep-everything-else
    case: command-leaves-a-clean-file
    boundary: cli
    target: python -m tools.clean_pr_body
    origin: human
    steps:
      - input:
          args: [body.md]
          files:
            body.md:
              $text: |
                Text.
              final_newline: true
        expect:
          exit: 0
          stdout: "changed=false\n"
          files:
            body.md:
              $text: |
                Text.
              final_newline: true

relations:
  - id: L1
    requirement: keep-everything-else
    relation: idempotent    # cleaning twice gives the same as cleaning once
    target: tools.clean_pr_body:clean
