format: 1
story: compares-a-version-with-a-malformed-collection
may_modify_tests: []

requirements:
  - id: malformed-is-not-comparable
    kind: new
    text: When a Version is compared with a collection that cannot build a version, the comparison shall return NotImplemented.
    source: written
  - id: well-formed-compares-as-a-version
    kind: preserve
    text: When a Version is compared with a collection that builds a version, the comparison shall compare them as versions.
    source: written

examples:
  - id: E-0001
    requirement: malformed-is-not-comparable
    case: equality
    boundary: function
    target: semver:Version
    origin: human
    steps:
      - input: {args: [1, 0, 0]}
        expect: {returns: {$repr: 'Version(major=1, minor=0, patch=0, prerelease=None, build=None)'}}
      - input: {call: __eq__, args: [[]]}
        expect: {returns: {$repr: NotImplemented}}
  - id: E-0003
    requirement: malformed-is-not-comparable
    case: equality
    boundary: function
    target: semver:Version
    origin: human
    steps:
      - input: {args: [1, 0, 0]}
        expect: {returns: {$repr: 'Version(major=1, minor=0, patch=0, prerelease=None, build=None)'}}
      - input: {call: __eq__, args: [[a]]}
        expect: {returns: {$repr: NotImplemented}}
  - id: E-0004
    requirement: malformed-is-not-comparable
    case: ordering
    boundary: function
    target: semver:Version
    origin: human
    steps:
      - input: {args: [1, 0, 0]}
        expect: {returns: {$repr: 'Version(major=1, minor=0, patch=0, prerelease=None, build=None)'}}
      - input: {call: __lt__, args: [[]]}
        expect: {returns: {$repr: NotImplemented}}
  - id: E-0006
    requirement: well-formed-compares-as-a-version
    case: well-formed
    boundary: function
    target: semver:Version
    origin: human
    steps:
      - input: {args: [1, 0, 0]}
        expect: {returns: {$repr: 'Version(major=1, minor=0, patch=0, prerelease=None, build=None)'}}
      - input: {call: __eq__, args: [[1, 0, 0]]}
        expect: {returns: true}
