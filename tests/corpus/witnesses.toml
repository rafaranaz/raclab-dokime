[[sample.run]]
project = "mdformat"
commit = "062ad6d0e00b18942944c50857b949f2e19a07c1"
example = "cli python -m mdformat --no-validate -, stdin \"a\\n\""
before = "exit 2, stderr: unrecognized arguments: --no-validate"
after = "exit 0, stdout a"
confirmed = true
why_not = ""

[[sample.run]]
project = "mdformat"
commit = "e05f2cfa44ccd77f39f3ce8394412b58465b1fa7"
example = "cli python -m mdformat a.md, files .mdformat.toml with wrap = 10 and a.md \"one two three four five six\\n\""
