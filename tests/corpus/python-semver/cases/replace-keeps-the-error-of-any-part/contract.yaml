format: 1
story: replace-keeps-the-error-of-any-part
may_modify_tests: []

requirements:
  - id: keep-the-error-of-the-constructor
    kind: change
    text: When replace is given known parts and the version constructor refuses one of their values with a TypeError, replace shall raise that TypeError with the message of the constructor.
    source: written
  - id: refuse-unknown-parts
    kind: preserve
    text: If replace is given a part that a version does not have, then replace shall raise a TypeError that names that part.
    source: written
  - id: replace-valid-parts
    kind: preserve
    text: When every part given to replace is a known part with a valid value, replace shall return the version with those parts replaced.
    source: written

examples:
  - id: E-d77d
    requirement: keep-the-error-of-the-constructor
    case: a-list
    boundary: function
    target: semver:replace
    origin: human
    steps:
      - input: {args: ["4.5.6"], kwargs: {"minor": [7]}}
        expect: {raises: {type: TypeError, message: {$contains: "not 'list'"}}}
  - id: E-f244
    requirement: keep-the-error-of-the-constructor
    case: a-mapping
    boundary: function
    target: semver:replace
    origin: human
    steps:
      - input: {args: ["4.5.6"], kwargs: {"minor": {"y": 2}}}
        expect: {raises: {type: TypeError, message: {$contains: "not 'dict'"}}}
  - id: E-6fdc
    requirement: keep-the-error-of-the-constructor
    case: a-null-among-others
    boundary: function
    target: semver:replace
    origin: human
    steps:
      - input: {args: ["0.9.1"], kwargs: {"minor": null, "patch": 2}}
        expect: {raises: {type: TypeError, message: {$contains: "not 'NoneType'"}}}
  - id: E-9170
    requirement: refuse-unknown-parts
    case: unknown
    boundary: function
    target: semver:replace
    origin: human
    steps:
      - input: {args: ["4.5.6"], kwargs: {"colour": 1}}
        expect: {raises: {type: TypeError, message: "replace() got 1 unexpected keyword argument(s): colour"}}
  - id: E-e6e5
    requirement: replace-valid-parts
    case: valid
    boundary: function
    target: semver:replace
    origin: human
    steps:
      - input: {args: ["4.5.6"], kwargs: {"patch": 9}}
        expect: {returns: "4.5.9"}
  - id: E-9bff
    requirement: replace-valid-parts
    case: valid
    boundary: function
    target: semver:replace
    origin: human
    steps:
      - input: {args: ["0.9.1-rc.2"], kwargs: {"prerelease": null}}
        expect: {returns: "0.9.1"}
