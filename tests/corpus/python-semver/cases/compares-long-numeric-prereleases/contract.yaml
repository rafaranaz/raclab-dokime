format: 1
story: compares-long-numeric-prereleases
may_modify_tests: []

requirements:
  - id: long-numeric-identifiers-compare-by-value
    kind: new
    text: When two versions are compared and a prerelease has a numeric identifier with more digits than Python converts to an integer, the comparison shall order the identifiers by their value.
    source: written
  - id: short-identifiers-compare-as-before
    kind: preserve
    text: When two versions whose numeric identifiers are short are compared, the comparison shall order them as before.
    source: written

examples:
  - id: E-2b0b
    requirement: long-numeric-identifiers-compare-by-value
    case: longer
    boundary: function
    target: semver:compare
    origin: human
    steps:
      - input: {args: ["2.4.6-", "2.4.6-7"]}
        expect: {returns: 1}
  - id: E-a614
    requirement: long-numeric-identifiers-compare-by-value
    case: same-length
    boundary: function
    target: semver:compare
    origin: human
    steps:
      - input: {args: ["2.4.6-", "2.4.6-"]}
        expect: {returns: 1}
  - id: E-c91a
    requirement: long-numeric-identifiers-compare-by-value
    case: prefix
    boundary: function
    target: semver:compare
    origin: human
    steps:
      - input: {args: ["2.4.6-y..3", "2.4.6-y."]}
        expect: {returns: 1}
  - id: E-3a43
    requirement: long-numeric-identifiers-compare-by-value
    case: before-text
    boundary: function
    target: semver:compare
    origin: human
    steps:
      - input: {args: ["2.4.6-", "2.4.6-beta"]}
        expect: {returns: -1}
  - id: E-2ed6
    requirement: short-identifiers-compare-as-before
    case: short
    boundary: function
    target: semver:compare
    origin: human
    steps:
      - input: {args: ["2.4.6-12", "2.4.6-3"]}
        expect: {returns: 1}
  - id: E-cb64
    requirement: short-identifiers-compare-as-before
    case: short
    boundary: function
    target: semver:compare
    origin: human
    steps:
      - input: {args: ["2.4.6-rc.1", "2.4.6-rc.1"]}
        expect: {returns: 0}
